[package]
name = "agentsandbox"
version = "0.1.0"
description = "Safely execute coding agents inside disposable Docker containers"
edition = "2021"

[workspace]
members = ["core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentsandbox-core = { path = "core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "agentsandbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
